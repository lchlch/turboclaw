<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurboClaw Web Client</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    header {
      background: #161b22;
      padding: 1rem 2rem;
      border-bottom: 1px solid #30363d;
    }
    
    header h1 {
      font-size: 1.2rem;
      color: #58a6ff;
    }
    
    header .status {
      font-size: 0.8rem;
      color: #8b949e;
      margin-top: 0.25rem;
    }
    
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .message {
      max-width: 80%;
      padding: 1rem;
      border-radius: 8px;
      line-height: 1.6;
    }
    
    .message.user {
      align-self: flex-end;
      background: #1f6feb;
      color: white;
    }
    
    .message.assistant {
      align-self: flex-start;
      background: #21262d;
      border: 1px solid #30363d;
    }
    
    .message .role {
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
      opacity: 0.8;
    }
    
    #input-area {
      background: #161b22;
      padding: 1rem 2rem;
      border-top: 1px solid #30363d;
      display: flex;
      gap: 0.5rem;
    }
    
    #input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
    }
    
    #input:focus {
      outline: none;
      border-color: #58a6ff;
    }
    
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    
    button:hover {
      background: #2ea043;
    }
    
    button:disabled {
      background: #30363d;
      cursor: not-allowed;
    }
    
    .thinking {
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🦞 TurboClaw Web Client</h1>
    <div class="status" id="status">正在连接...</div>
  </header>
  
  <div id="messages"></div>
  
  <div id="input-area">
    <input 
      type="text" 
      id="input" 
      placeholder="输入消息..."
      disabled
    />
    <button id="send" disabled>发送</button>
  </div>

  <script>
    const ws = new WebSocket('ws://localhost:18790');
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const status = document.getElementById('status');
    
    let isConnected = false;
    
    ws.onopen = () => {
      isConnected = true;
      status.textContent = '已连接';
      status.style.color = '#3fb950';
      input.disabled = false;
      sendBtn.disabled = false;
      input.focus();
    };
    
    ws.onclose = () => {
      isConnected = false;
      status.textContent = '连接已断开';
      status.style.color = '#f85149';
      input.disabled = true;
      sendBtn.disabled = true;
    };
    
    ws.onerror = (err) => {
      status.textContent = '连接错误';
      status.style.color = '#f85149';
      console.error('WebSocket error:', err);
    };
    
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      
      if (data.type === 'connected') {
        addMessage('system', `已连接到 TurboClaw (clientId: ${data.clientId})`);
      } else if (data.type === 'message') {
        addMessage(data.role, data.content);
      }
    };
    
    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = `
        <div class="role">${role === 'user' ? 'You' : role === 'assistant' ? 'AI' : 'System'}</div>
        <div>${escapeHtml(content)}</div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function send() {
      const text = input.value.trim();
      if (!text || !isConnected) return;
      
      addMessage('user', text);
      ws.send(JSON.stringify({ type: 'message', content: text }));
      input.value = '';
      
      // 显示思考中
      const thinking = document.createElement('div');
      thinking.className = 'message assistant thinking';
      thinking.id = 'thinking';
      thinking.innerHTML = '<div class="role">AI</div><div>思考中...</div>';
      messages.appendChild(thinking);
      messages.scrollTop = messages.scrollHeight;
    }
    
    // 移除思考提示
    ws.addEventListener('message', (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'message') {
        document.getElementById('thinking')?.remove();
      }
    });
    
    sendBtn.addEventListener('click', send);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') send();
    });
  </script>
</body>
</html>
